apiVersion: apps/v1
kind: Deployment

metadata:
  name: secure-demo-app
  namespace: apps

spec:
  replicas: 2

  selector:
    matchLabels:
      app: secure-demo-app

  template:
    metadata:
      labels:
        app: secure-demo-app

    spec:
      containers:
      - name: secure-demo-app

        # TEMP IMAGE (we will replace via CI later)
        image: nginx

        ports:
        - containerPort: 3000

        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"

          limits:
            memory: "256Mi"
            cpu: "500m"

        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
